# On every push to main: verify every release, build `v2/index.json`, and deploy it to Pages:
#   https://weft-rust.github.io/weft-mods-index/v2/index.json
# The index is not signed. The launcher trusts each build because the index pins its sha256 (a
# reviewed PR put it there) and because the release's attestation proves which workflow of the
# mod's repo built it. Pages serves only what the last successful run built.
# Actions are pinned by commit; Dependabot (.github/dependabot.yml) proposes updates.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: Verify every release and build the index
        shell: bash  # with pipefail: a failed build fails the step despite tee
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m weftindex build --out site | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v2/index.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
