# On every pull request:
#   - `test`: the unit tests and the offline validation, on the oldest and newest Python we support.
#   - `verify`: an online re-check of the version files the PR adds or changes (`check --since`:
#     re-download, re-hash, ABI, provenance). It runs the base branch's tooling, not the PR's, so
#     a PR can't pass by changing the checks; a PR that changes both the tooling and version files
#     has to be split.
# The weekly re-check of every version runs in publish.yml, before it re-signs.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Validate
        run: python -m weftindex validate

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Re-verify the changed versions, with the base branch's tooling
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE" ]; then
            python3 -m weftindex check
            exit
          fi
          git worktree add -q "$RUNNER_TEMP/base" "origin/$BASE"
          cd "$RUNNER_TEMP/base"
          python3 -m weftindex --root "$GITHUB_WORKSPACE" validate
          python3 -m weftindex --root "$GITHUB_WORKSPACE" check --since "origin/$BASE"
