# On every pull request:
#   - `test`: the unit tests and the offline validation, on the oldest and newest Python we support.
#   - `verify`: builds the index as Publish would: downloads every release, verifies its
#     attestation and reads its weft-mod.toml. The job summary lists, for each build, the commit
#     and workflow that built it, for the reviewer.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Validate
        run: python -m weftindex validate

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every release and build the index
        shell: bash  # with pipefail: a failed build fails the step despite tee
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m weftindex build --out dist | tee -a "$GITHUB_STEP_SUMMARY"
